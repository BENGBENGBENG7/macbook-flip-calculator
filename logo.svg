<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Macbook flip</title>
  <desc id="desc">Rounded cream calculator with a blue display, coral and green function keys, and a long yellow key on a bright green app background.</desc>
  <defs>
    <linearGradient id="background" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4BE75B"/>
      <stop offset=".5" stop-color="#25D366"/>
      <stop offset="1" stop-color="#0BBC4B"/>
    </linearGradient>
    <linearGradient id="body" x1="512" y1="154" x2="512" y2="866" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DFD8CC"/>
      <stop offset=".55" stop-color="#D5CFC1"/>
      <stop offset="1" stop-color="#C7BFB0"/>
    </linearGradient>
    <linearGradient id="display" x1="512" y1="204" x2="512" y2="362" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9AC5E7"/>
      <stop offset="1" stop-color="#75A8D1"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFCF2"/>
      <stop offset="1" stop-color="#EAE5D7"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EF8A70"/>
      <stop offset="1" stop-color="#E27352"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="0" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B5CD8E"/>
      <stop offset="1" stop-color="#98B877"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="198" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6DC75"/>
      <stop offset="1" stop-color="#EFC954"/>
    </linearGradient>
    <g id="cream-key"><rect y="3" width="88" height="88" rx="24" fill="#ACA38F" fill-opacity=".12"/><rect width="88" height="88" rx="24" fill="url(#key)"/></g>
  </defs>
  <rect id="app-background" width="1024" height="1024" rx="230" fill="url(#background)"/>
  <g id="calculator">
    <rect x="260" y="168" width="504" height="712" rx="74" fill="#126A35" fill-opacity=".12"/>
    <rect x="260" y="154" width="504" height="712" rx="72" fill="url(#body)" stroke="#B2AA9A" stroke-width="3"/>
    <path d="M285 217C285 195.461 302.461 178 324 178H700C721.539 178 739 195.461 739 217" stroke="#FFFDF5" stroke-opacity=".22" stroke-width="3" stroke-linecap="round"/>
    <rect x="304" y="204" width="416" height="154" rx="33" fill="url(#display)" stroke="#7EA9C6" stroke-width="4"/>
    <rect x="323" y="222" width="378" height="23" rx="11.5" fill="#D5E9F8" fill-opacity=".3"/>
    <g transform="translate(302 410)"><rect width="88" height="88" rx="24" fill="url(#coral)"/></g>
    <use href="#cream-key" x="412" y="410"/>
    <use href="#cream-key" x="522" y="410"/>
    <g transform="translate(632 410)"><rect width="88" height="88" rx="24" fill="url(#sage)"/></g>
    <use href="#cream-key" x="302" y="520"/>
    <use href="#cream-key" x="412" y="520"/>
    <use href="#cream-key" x="522" y="520"/>
    <use href="#cream-key" x="632" y="520"/>
    <use href="#cream-key" x="302" y="630"/>
    <use href="#cream-key" x="412" y="630"/>
    <use href="#cream-key" x="522" y="630"/>
    <use href="#cream-key" x="302" y="740"/>
    <use href="#cream-key" x="412" y="740"/>
    <use href="#cream-key" x="522" y="740"/>
    <g transform="translate(632 630)"><rect y="3" width="88" height="198" rx="25" fill="#ACA38F" fill-opacity=".12"/><rect width="88" height="198" rx="25" fill="url(#yellow)"/></g>
  </g>
</svg>
