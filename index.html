<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f4">
  <meta name="description" content="MacBook Pro 翻新买卖核算工具：实时汇率、费用明细、成交价估算与利润排序。">
  <title>MacBook Flip｜翻新核算</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="MacBook Flip 首页"><span class="brand-mark">M</span><span>MacBook <b>Flip</b></span></a>
    <div class="rate-pill"><span class="live-dot"></span><span id="rateText">正在获取汇率…</span><button id="refreshRate" class="icon-button" title="刷新汇率" aria-label="刷新汇率">↻</button></div>
  </header>

  <main id="top" class="page-shell">
    <section class="intro">
      <div>
        <p class="eyebrow">BUY SMART · SELL WELL</p>
        <h1>MacBook Pro 翻新核算</h1>
        <p class="intro-copy">把商品资料、成交参考和利润分析放在一起，买前看清每一笔账。</p>
      </div>
      <button id="addListing" class="primary-button"><span aria-hidden="true">＋</span> 添加商品</button>
    </section>

    <section class="toolbar" aria-label="列表工具">
      <div class="toolbar-copy"><strong id="listingCount">0 台商品</strong><span>按预计利润从高到低排列</span></div>
      <label class="sort-select">排序
        <select id="sortMode"><option value="profit">预计利润</option><option value="date">最近添加</option></select>
      </label>
    </section>

    <section id="listingGrid" class="listing-grid" aria-live="polite"></section>
    <section id="emptyState" class="empty-state">
      <div class="empty-icon">⌕</div><h2>还没有商品</h2><p>添加一条闲鱼商品，录入新加坡近期成交样本，即可查看完整核算。</p><button class="text-button" id="addFirst">添加第一台 <span>→</span></button>
    </section>

    <footer class="page-footer"><span>汇率由 Frankfurter 提供 · 最新可用日度参考汇率</span><span>数据保存在此浏览器</span></footer>
  </main>

  <dialog id="listingDialog" class="listing-dialog">
    <form id="listingForm" novalidate>
      <div class="dialog-head"><div><p class="eyebrow">LISTING DETAILS</p><h2 id="dialogTitle">添加商品</h2></div><button type="button" class="icon-button close-button" id="closeDialog" aria-label="关闭">×</button></div>
      <input type="hidden" id="listingId" name="id">
      <div class="form-section"><h3>商品信息</h3><div class="form-grid">
        <label class="wide">商品原描述<input name="description" required placeholder="例：M3 Pro 14 寸，成色好，个人自用"></label>
        <label class="wide">商品链接<input name="url" type="url" placeholder="https://www.goofish.com/…"></label>
        <label>商品图片链接<input name="image" type="url" placeholder="https://…"></label>
        <label>卖家信息<input name="seller" placeholder="昵称、信用、所在地"></label>
        <label>商品价格（人民币）<input name="priceCny" type="number" min="0" step="1" required placeholder="例如 6500"></label>
        <label>尺寸<input name="size" placeholder="14 英寸"></label>
        <label>芯片<input name="chip" placeholder="M3 Pro"></label>
        <label>内存<input name="memory" placeholder="18 GB"></label>
        <label>硬盘<input name="storage" placeholder="512 GB"></label>
        <label>电池健康度<input name="battery" placeholder="92%"></label>
        <label>循环次数<input name="cycles" type="number" min="0" placeholder="例如 120"></label>
        <label>成色<input name="condition" placeholder="轻微使用痕迹"></label>
        <label>保修情况<input name="warranty" placeholder="至 2026 年 8 月 / 无"></label>
      </div></div>
      <div class="form-section"><h3>新加坡已成交参考</h3><p class="section-hint">录入近期真实成交价（新币）。建议填写同配置的低价与高价；可附成交记录链接。</p>
        <div class="form-grid"><label>成交低价（S$）<input name="saleLow" type="number" min="0" step="1" required placeholder="例如 1800"></label><label>成交高价（S$）<input name="saleHigh" type="number" min="0" step="1" required placeholder="例如 2100"></label><label>成交样本数<input name="sampleCount" type="number" min="1" step="1" value="1"></label><label>样本来源 / 链接<input name="soldSource" placeholder="平台、成交日期或链接"></label></div>
      </div>
      <div class="form-section"><h3>费用与判断参数</h3><div class="form-grid">
        <label>跨境运输（新币）<input name="shippingSgd" type="number" min="0" step="1" value="35"></label>
        <label>维修 / 整备预算（新币）<input name="repairSgd" type="number" min="0" step="1" value="0"></label>
        <label>平台费率（%）<input name="feePercent" type="number" min="0" max="100" step="0.1" value="0"></label>
        <label>预期最低利润（新币）<input name="targetProfit" type="number" step="1" value="150"></label>
      </div></div>
      <div class="dialog-actions"><button type="button" class="secondary-button" id="cancelDialog">取消</button><button class="primary-button" type="submit">保存商品</button></div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
